name: Release

# Runs when a version tag is pushed (v0.1.0, v1.2.3-rc.1…). Builds the Linux
# binaries (the web app is embedded), a checksum file, a multi-arch image on
# GHCR, and creates the GitHub release.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  binaries:
    name: Binaries and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Web app
        working-directory: web
        run: npm ci && npm run build
      - name: Tests
        run: go test ./...
      - name: Build (linux amd64, arm64, armv7)
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir dist
          for t in amd64:amd64 arm64:arm64 arm:armv7; do
            arch=${t%%:*}; name=${t##*:}
            out="atalaia_${VERSION}_linux_${name}"
            mkdir "dist/$out"
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch GOARM=7 go build -trimpath \
              -ldflags "-s -w -X github.com/EttoreCSenatore/atalaia/internal/version.Version=${VERSION}" \
              -o "dist/$out/atalaia" ./cmd/atalaia
            cp LICENSE README.md README.en.md "dist/$out/"
            tar -C dist -czf "dist/$out.tar.gz" "$out"
            rm -r "dist/$out"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="Atalaia ${TAG}. Linux binaries (amd64, arm64, armv7) with the web app inside; verify with SHA256SUMS. Image: ghcr.io/${GITHUB_REPOSITORY,,}:${TAG#v}. Changes: CHANGELOG.md."
          pre=""; case "$TAG" in *-*) pre="--prerelease";; esac
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS --title "$TAG" --notes "$notes" --verify-tag $pre

  image:
    name: Image on GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tags
        id: meta
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          v="${GITHUB_REF_NAME#v}"
          tags="$repo:$v"
          case "$v" in *-*) ;; *) tags="$tags,$repo:latest";; esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VERSION=${{ github.ref_name }}
          provenance: true
          sbom: true
