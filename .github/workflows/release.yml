name: Release

# Runs when a version tag is pushed (v0.1.0, v1.2.3-rc.1…). Builds the Linux
# binaries (the web app is embedded), a checksum file, a multi-arch image on
# GHCR, and creates the GitHub release.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  check:
    name: Tag matches releases.yaml and CHANGELOG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go run ./cmd/releasenotes check -changelog CHANGELOG.md -tag "$GITHUB_REF_NAME"

  binaries:
    name: Binaries and release
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Web app
        working-directory: web
        run: npm ci && npm run build
      - name: Tests
        run: go test ./...
      - name: Build (linux amd64, arm64, armv7), tarballs and .deb/.rpm packages
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir dist bin
          for t in amd64:amd64:amd64 arm64:arm64:arm64 arm:armv7:arm7; do
            IFS=: read -r goarch name nfarch <<< "$t"
            out="atalaia_${VERSION}_linux_${name}"
            mkdir "dist/$out" "bin/$name"
            CGO_ENABLED=0 GOOS=linux GOARCH=$goarch GOARM=7 go build -trimpath \
              -ldflags "-s -w -X github.com/EttoreCSenatore/atalaia/internal/version.Version=${VERSION}" \
              -o "bin/$name/atalaia" ./cmd/atalaia
            cp "bin/$name/atalaia" LICENSE README.md README.en.md "dist/$out/"
            tar -C dist -czf "dist/$out.tar.gz" "$out"
            rm -r "dist/$out"
            for fmt in deb rpm; do
              VERSION="${VERSION#v}" ARCH="$nfarch" BINARY="bin/$name/atalaia" \
                go run github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.49.0 package -f deploy/nfpm.yaml -p "$fmt" -t dist/
            done
          done
          (cd dist && sha256sum *.tar.gz *.deb *.rpm > SHA256SUMS)
      - name: Upgrade test of these packages from the previous release (Debian 13, Fedora 44)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          mkdir prev
          gh release download "$prev" --repo "$GITHUB_REPOSITORY" --dir prev \
            --pattern "atalaia_${prev#v}_amd64.deb" --pattern "atalaia-${prev#v}-1.x86_64.rpm" --pattern SHA256SUMS
          (cd prev && sha256sum -c SHA256SUMS --ignore-missing)
          new=${GITHUB_REF_NAME#v}
          docker run --rm -v "$PWD/prev:/old:ro" -v "$PWD/dist:/new:ro" -v "$PWD/scripts/testar-pacotes.sh:/t.sh:ro" \
            debian:13-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2 \
            /t.sh "/old/atalaia_${prev#v}_amd64.deb" "/new/atalaia_${new}_amd64.deb"
          docker run --rm -v "$PWD/prev:/old:ro" -v "$PWD/dist:/new:ro" -v "$PWD/scripts/testar-pacotes.sh:/t.sh:ro" \
            fedora:44@sha256:15da97ed9aa94dd3d92c3925eb89520f6c80e07ea7ee24cba848d1f8b6912b3e \
            /t.sh "/old/atalaia-${prev#v}-1.x86_64.rpm" "/new/atalaia-${new}-1.x86_64.rpm"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          go run ./cmd/releasenotes notes "$TAG" > notes.md
          {
            echo
            echo "---"
            echo
            echo "Linux binaries (amd64, arm64, armv7) with the web app inside, plus .deb and .rpm packages with a hardened systemd unit; verify with \`SHA256SUMS\`. Image: \`ghcr.io/${GITHUB_REPOSITORY,,}:${TAG#v}\`. Details: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md)."
          } >> notes.md
          pre=""; case "$TAG" in *-*) pre="--prerelease";; esac
          gh release create "$TAG" dist/*.tar.gz dist/*.deb dist/*.rpm dist/SHA256SUMS --title "$TAG" --notes-file notes.md --verify-tag $pre

  image:
    name: Image on GHCR
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tags
        id: meta
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          v="${GITHUB_REF_NAME#v}"
          tags="$repo:$v"
          case "$v" in *-*) ;; *) tags="$tags,$repo:latest";; esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VERSION=${{ github.ref_name }}
          provenance: true
          sbom: true
