name: Release

# Runs when a version tag is pushed (v0.1.0, v1.2.3-rc.1…). Builds the Linux
# binaries (the web app is embedded), a checksum file, a multi-arch image on
# GHCR, and creates the GitHub release.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  binaries:
    name: Binaries and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Web app
        working-directory: web
        run: npm ci && npm run build
      - name: Tests
        run: go test ./...
      - name: Build (linux amd64, arm64, armv7), tarballs and .deb/.rpm packages
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir dist bin
          for t in amd64:amd64:amd64 arm64:arm64:arm64 arm:armv7:arm7; do
            IFS=: read -r goarch name nfarch <<< "$t"
            out="atalaia_${VERSION}_linux_${name}"
            mkdir "dist/$out" "bin/$name"
            CGO_ENABLED=0 GOOS=linux GOARCH=$goarch GOARM=7 go build -trimpath \
              -ldflags "-s -w -X github.com/EttoreCSenatore/atalaia/internal/version.Version=${VERSION}" \
              -o "bin/$name/atalaia" ./cmd/atalaia
            cp "bin/$name/atalaia" LICENSE README.md README.en.md "dist/$out/"
            tar -C dist -czf "dist/$out.tar.gz" "$out"
            rm -r "dist/$out"
            for fmt in deb rpm; do
              VERSION="${VERSION#v}" ARCH="$nfarch" BINARY="bin/$name/atalaia" \
                go run github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.49.0 package -f deploy/nfpm.yaml -p "$fmt" -t dist/
            done
          done
          (cd dist && sha256sum *.tar.gz *.deb *.rpm > SHA256SUMS)
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="Atalaia ${TAG}. Linux binaries (amd64, arm64, armv7) with the web app inside, plus .deb and .rpm packages with a hardened systemd unit; verify with SHA256SUMS. Image: ghcr.io/${GITHUB_REPOSITORY,,}:${TAG#v}. Changes: CHANGELOG.md."
          pre=""; case "$TAG" in *-*) pre="--prerelease";; esac
          gh release create "$TAG" dist/*.tar.gz dist/*.deb dist/*.rpm dist/SHA256SUMS --title "$TAG" --notes "$notes" --verify-tag $pre

  image:
    name: Image on GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tags
        id: meta
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          v="${GITHUB_REF_NAME#v}"
          tags="$repo:$v"
          case "$v" in *-*) ;; *) tags="$tags,$repo:latest";; esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: VERSION=${{ github.ref_name }}
          provenance: true
          sbom: true
