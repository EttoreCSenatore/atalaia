name: CI & Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs (build pt-BR e inglês)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Auditoria npm (avisos aceitos documentados no script)
        run: python3 ../scripts/auditar-npm.py .
      - name: Documentação em português e inglês (mesma estrutura)
        run: python3 ../scripts/checar-traducao.py
      - name: Licenças das dependências (AGPL-3.0)
        run: python3 ../scripts/auditar-licencas.py --npm website
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  go:
    name: Agente Go (formato, vet, testes, vulnerabilidades)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -trimpath -o /tmp/atalaia ./cmd/atalaia
      - name: Fumaça do binário
        run: /tmp/atalaia version
      - name: Licenças das dependências Go (compatíveis com a AGPL)
        run: go run github.com/google/go-licenses@v1.6.0 check ./... --allowed_licenses=MIT,BSD-3-Clause,BSD-2-Clause,Apache-2.0,ISC,MPL-2.0 --ignore modernc.org/mathutil --ignore github.com/EttoreCSenatore/atalaia
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [docs, go]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
