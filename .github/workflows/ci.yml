name: CI & Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs (build pt-BR e inglês)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Auditoria npm (avisos aceitos documentados no script)
        run: python3 ../scripts/auditar-npm.py .
      - name: Documentação em português e inglês (mesma estrutura)
        run: python3 ../scripts/checar-traducao.py
      - name: Licenças das dependências (AGPL-3.0)
        run: python3 ../scripts/auditar-licencas.py --npm website
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  go:
    name: Agente Go (formato, vet, testes, vulnerabilidades)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -trimpath -o /tmp/atalaia ./cmd/atalaia
      - name: Fumaça do binário
        run: /tmp/atalaia version
      - name: Licenças das dependências Go (compatíveis com a AGPL)
        run: go run github.com/google/go-licenses@v1.6.0 check ./... --allowed_licenses=MIT,BSD-3-Clause,BSD-2-Clause,Apache-2.0,ISC,MPL-2.0 --ignore modernc.org/mathutil --ignore github.com/EttoreCSenatore/atalaia
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: gosec (análise estática de segurança; G304 e G117 aceitos, veja a documentação)
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 -quiet -exclude=G304,G117 ./...

  web:
    name: App web (tipos, testes, auditoria, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Auditoria npm (dependências de produção)
        run: python3 ../scripts/auditar-npm.py .
      - name: Licenças das dependências (AGPL-3.0)
        run: python3 ../scripts/auditar-licencas.py --npm web
      - name: SBOM do app web (CycloneDX)
        run: npm sbom --omit=dev --sbom-format cyclonedx > ../sbom-web.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-web
          path: sbom-web.cdx.json
      - run: npm run build

  imagem:
    name: Imagem (build, varredura, teste de fumaça)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker build -f deploy/Dockerfile -t atalaia:ci .
      - name: Valida o compose
        working-directory: deploy
        run: docker compose config --quiet
      - name: Varredura de vulnerabilidades (Trivy; falha em CRÍTICA com correção disponível)
        run: |
          docker save atalaia:ci -o atalaia.tar
          docker run --rm -v "$PWD/atalaia.tar:/image.tar:ro" aquasec/trivy:0.76.2 image --input /image.tar \
            --scanners vuln --ignore-unfixed --severity CRITICAL --exit-code 1
      - name: Teste de fumaça (servidor sobe, app e API respondem, código de configuração no log)
        run: |
          docker run -d --name atalaia-smoke --network host atalaia:ci serve --listen 127.0.0.1:18080
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:18080/api/status >/dev/null && break; sleep 1; done
          curl -fs http://127.0.0.1:18080/api/status | grep -q '"setup_required":true'
          curl -fs http://127.0.0.1:18080/ | grep -qi '<title>Atalaia'
          curl -fsI http://127.0.0.1:18080/api/status | grep -qi 'content-security-policy'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/devices)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://127.0.0.1:18080/api/status)" = 403
          docker logs atalaia-smoke 2>&1 | grep -q 'Setup code'
          docker rm -f atalaia-smoke

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [docs, go, web, imagem]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
