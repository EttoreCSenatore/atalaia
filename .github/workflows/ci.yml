name: CI & Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs (build pt-BR e inglês)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Auditoria npm (avisos aceitos documentados no script)
        run: python3 ../scripts/auditar-npm.py .
      - name: Documentação em português e inglês (mesma estrutura)
        run: python3 ../scripts/checar-traducao.py
      - name: Licenças das dependências (AGPL-3.0)
        run: python3 ../scripts/auditar-licencas.py --npm website
      - run: npm run build
      - name: Demonstração pública (app web com dados fictícios, em /atalaia/demo/)
        working-directory: web
        run: |
          npm ci
          npm run build:demo
          cp -r dist-demo ../website/build/demo
          grep -q '/atalaia/demo/assets/' ../website/build/demo/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/build

  go:
    name: Agente Go (formato, vet, testes, vulnerabilidades)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Fixação da cadeia de suprimentos (ações por SHA, imagens por digest)
        run: python3 -I scripts/checar-fixacao.py
      - name: releases.yaml (formato, ordem, CHANGELOG)
        run: go run ./cmd/releasenotes check -changelog CHANGELOG.md
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -trimpath -o /tmp/atalaia ./cmd/atalaia
      - name: Fumaça do binário
        run: /tmp/atalaia version
      - name: Licenças das dependências Go (compatíveis com a AGPL)
        run: go run github.com/google/go-licenses@v1.6.0 check ./... --allowed_licenses=MIT,BSD-3-Clause,BSD-2-Clause,Apache-2.0,ISC,MPL-2.0 --ignore modernc.org/mathutil --ignore github.com/EttoreCSenatore/atalaia
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: gosec (análise estática de segurança; G304 e G117 aceitos, veja a documentação)
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 -quiet -exclude=G304,G117 ./...

  web:
    name: App web (tipos, testes, auditoria, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Auditoria npm (dependências de produção)
        run: python3 ../scripts/auditar-npm.py .
      - name: Licenças das dependências (AGPL-3.0)
        run: python3 ../scripts/auditar-licencas.py --npm web
      - name: SBOM do app web (CycloneDX)
        run: npm sbom --omit=dev --sbom-format cyclonedx > ../sbom-web.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-web
          path: sbom-web.cdx.json
      - run: npm run build
      - name: O app real não leva o código nem os dados da demonstração
        run: |
          if grep -l "demoRequest\|Marias-iPhone" ../internal/web/dist/assets/*; then
            echo "demo code or fictitious data in the real app build"; exit 1
          fi

  imagem:
    name: Imagem (build, varredura, teste de fumaça)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f deploy/Dockerfile -t atalaia:ci .
      - name: Valida o compose
        working-directory: deploy
        run: docker compose config --quiet
      - name: Varredura de vulnerabilidades (Trivy; falha em CRÍTICA com correção disponível)
        run: |
          docker save atalaia:ci -o atalaia.tar
          docker run --rm -v "$PWD/atalaia.tar:/image.tar:ro" aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb image --input /image.tar \
            --scanners vuln --ignore-unfixed --severity CRITICAL --exit-code 1
      - name: Teste de fumaça (servidor sobe, app e API respondem, código de configuração no log)
        run: |
          docker run -d --name atalaia-smoke --network host atalaia:ci serve --listen 127.0.0.1:18080
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:18080/api/status >/dev/null && break; sleep 1; done
          curl -fs http://127.0.0.1:18080/api/status | grep -q '"setup_required":true'
          curl -fs http://127.0.0.1:18080/ | grep -qi '<title>Atalaia'
          curl -fsI http://127.0.0.1:18080/api/status | grep -qi 'content-security-policy'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/devices)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/releases)" = 401
          curl -fs http://127.0.0.1:18080/whats-new | grep -qi '<title>Atalaia'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://127.0.0.1:18080/api/status)" = 403
          docker logs atalaia-smoke 2>&1 | grep -q 'Setup code'
          curl -fs http://127.0.0.1:18080/api/health | grep -q '"database":"ok"'
          docker exec atalaia-smoke /atalaia health --url http://127.0.0.1:18080
          docker rm -f atalaia-smoke

  pacotes:
    name: Pacotes (.deb no Debian, .rpm no Fedora)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Monta duas versões dos pacotes (para testar a atualização)
        run: |
          mkdir -p pkg
          for v in 0.0.1 0.0.2; do
            # the newer package also changes /etc/default/atalaia, like real releases do (dpkg conffile path)
            if [ "$v" = 0.0.2 ]; then echo "# changed in 0.0.2" >> deploy/atalaia.default; fi
            CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/EttoreCSenatore/atalaia/internal/version.Version=v$v" -o "pkg/atalaia-$v" ./cmd/atalaia
            for fmt in deb rpm; do
              VERSION=$v ARCH=amd64 BINARY="pkg/atalaia-$v" \
                go run github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.49.0 package -f deploy/nfpm.yaml -p "$fmt" -t pkg/
            done
          done
      - name: Debian 13 (instala, systemd-analyze verify, atualiza, remove, purge)
        run: |
          docker run --rm -v "$PWD/pkg:/pkg:ro" -v "$PWD/scripts/testar-pacotes.sh:/t.sh:ro" \
            debian:13-slim@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2 \
            /t.sh /pkg/atalaia_0.0.1_amd64.deb /pkg/atalaia_0.0.2_amd64.deb
      - name: Fedora 44 (instala, systemd-analyze verify, atualiza, remove)
        run: |
          docker run --rm -v "$PWD/pkg:/pkg:ro" -v "$PWD/scripts/testar-pacotes.sh:/t.sh:ro" \
            fedora:44@sha256:15da97ed9aa94dd3d92c3925eb89520f6c80e07ea7ee24cba848d1f8b6912b3e \
            /t.sh /pkg/atalaia-0.0.1-1.x86_64.rpm /pkg/atalaia-0.0.2-1.x86_64.rpm

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [docs, go, web, imagem, pacotes]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
